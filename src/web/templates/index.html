<!DOCTYPE html>
<html>
<head>
    <title>NetScope</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div id="title-bar">
        <div id="title">NetScope - Network Visualizer</div>
        <div id="status-indicator" class="status-stopped"></div>
    </div>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search IP or Hostname...">
    </div>

    <div id="control-panel">
        <div class="control-group">
            <button id="start-btn"><i class="fas fa-play"></i> Start</button>
            <button id="stop-btn"><i class="fas fa-stop"></i> Stop</button>
            <button id="clear-btn"><i class="fas fa-trash"></i> Clear</button>
        </div>
    </div>
    
    <div id="mynetwork" data-update-interval="{{ update_interval }}"></div>

    <div id="info-panel">
        <div id="info-content">Click on a node to see details.</div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
